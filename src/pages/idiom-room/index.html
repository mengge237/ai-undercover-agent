<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPOSTOR — 成语接龙·联机</title>
    <link rel="stylesheet" href="../../styles/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-mpostor-boot="on">
    <div class="hazard"></div>

    <div class="idiom-room-container">
        <header class="room-header">
            <a href="../game-hall/index.html" class="back-link">← 返回大厅</a>
            <h1 class="glitch-text" data-text="成语接龙">成语接龙</h1>
            <div class="header-right">
                <span class="tag" id="roomIdTag">ROOM ---</span>
                <span class="status" id="gameStatus">连接中</span>
                <button class="btn btn-sm" id="muteBtn">SND:ON</button>
            </div>
        </header>

        <main class="room-main">
            <!-- 玩家列表 -->
            <div class="panel players-panel">
                <div class="panel-header">
                    <span class="panel-title">Literati</span>
                    <span class="tag" id="playerCount">0/0</span>
                </div>
                <div class="players-list" id="playersList">
                    <div class="empty-hint">// 连接中...</div>
                </div>
            </div>

            <!-- 末字指示 -->
            <div class="lastchar-panel panel">
                <div class="lastchar-label">// 下一词首字</div>
                <div class="lastchar-box">
                    <span class="bracket">[</span>
                    <span class="lastchar-value" id="lastCharDisplay">—</span>
                    <span class="bracket">]</span>
                </div>
                <div class="lastchar-hint" id="lastCharHint">等待开局...</div>
            </div>

            <!-- 接龙链条 -->
            <div class="chain-panel panel">
                <div class="panel-header">
                    <span class="panel-title">Chain Log</span>
                    <span class="tag" id="sourceTag">--</span>
                </div>
                <div class="chain-log" id="chainLog">
                    <div class="empty-hint">// 等待开局，AI 出首词</div>
                </div>
            </div>

            <!-- 输入行 -->
            <div class="idiom-input-row panel">
                <span class="prompt">&gt;</span>
                <input type="text" id="idiomInput" class="input" placeholder="输入四字成语..." maxlength="4" autocomplete="off" disabled>
                <button class="mic-btn" type="button" title="语音输入">REC</button>
                <button class="btn btn-primary" id="playBtn" disabled>接龙</button>
                <button class="btn" id="skipBtn" style="display:none;">跳过本轮</button>
            </div>
            <div class="feedback-line" id="idiomFeedback"></div>

            <!-- 房主控制台（等待态） -->
            <div class="panel host-panel" id="hostPanel" style="display:none;">
                <div class="panel-header">
                    <span class="panel-title">HOST CONSOLE</span>
                    <span class="tag warn">房主</span>
                </div>
                <div class="host-actions">
                    <button class="btn btn-primary" id="startBtn">» 开始游戏（需≥2人）</button>
                    <button class="btn" id="closeBtn">解散房间</button>
                </div>
                <div class="kick-list" id="kickList"></div>
            </div>
        </main>

        <!-- 结局弹窗 -->
        <div class="game-over" id="overPanel" style="display:none;">
            <div class="game-over-content">
                <div class="result-icon" id="resultIcon">[IDIOM]</div>
                <h2 class="glitch-text" id="resultTitle" data-text="GAME OVER">GAME OVER</h2>
                <p class="result-desc" id="resultDesc"></p>
                <button class="btn btn-primary" id="backHallBtn">返回大厅</button>
                <button class="btn" id="resetBtn" style="display:none;">重置房间</button>
            </div>
        </div>
    </div>

    <script src="../../fun/mpostor.js"></script>
    <script src="script.js"></script>
</body>
</html>
