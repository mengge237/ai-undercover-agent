<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPOSTOR — 海龟汤·联机</title>
    <link rel="stylesheet" href="../../styles/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-mpostor-boot="on">
    <div class="hazard"></div>

    <div class="turtle-room-container">
        <header class="room-header">
            <a href="../game-hall/index.html" class="back-link">← 返回大厅</a>
            <h1 class="glitch-text" data-text="海龟汤">海龟汤</h1>
            <div class="header-right">
                <span class="tag" id="roomIdTag">ROOM ---</span>
                <span class="status" id="gameStatus">连接中</span>
                <button class="btn btn-sm" id="muteBtn">SND:ON</button>
            </div>
        </header>

        <main class="room-main">
            <!-- 玩家列表 -->
            <div class="panel players-panel">
                <div class="panel-header">
                    <span class="panel-title">Investigators</span>
                    <span class="tag" id="playerCount">0/0</span>
                </div>
                <div class="players-list" id="playersList">
                    <div class="empty-hint">// 连接中...</div>
                </div>
            </div>

            <!-- 汤面 -->
            <div class="panel story-panel">
                <div class="panel-header">
                    <span class="panel-title">Soup Surface</span>
                    <span class="tag" id="sourceTag">--</span>
                    <span class="tag" id="questionCount">Q:0</span>
                </div>
                <p class="story-text" id="turtleStory">等待开局...</p>
            </div>

            <!-- 问答日志 -->
            <div class="panel log-panel">
                <div class="panel-header">
                    <span class="panel-title">Interrogation Log</span>
                    <span class="tag">TRANSCRIPT</span>
                </div>
                <div class="turtle-log" id="turtleLog">
                    <div class="empty-hint">// 向房主提问，答案只有：是 / 否 / 无法确定</div>
                </div>
            </div>

            <!-- 提问输入 -->
            <div class="ask-area panel">
                <span class="prompt">&gt;</span>
                <input type="text" id="turtleInput" class="input" placeholder="提问或猜汤底..." maxlength="100" disabled>
                <button class="mic-btn" type="button" title="语音输入">REC</button>
                <button class="btn btn-primary" id="askBtn" disabled>提问</button>
                <button class="btn" id="guessBtn" disabled>猜汤底</button>
                <div class="feedback-line" id="turtleFeedback"></div>
            </div>

            <!-- 房主判定面板（对局中） -->
            <div class="panel judge-panel" id="judgePanel" style="display:none;">
                <div class="panel-header">
                    <span class="panel-title">HOST VERDICT</span>
                    <span class="tag warn">房主判定</span>
                </div>
                <div class="pending-list" id="pendingList"></div>
                <div class="judge-actions">
                    <button class="btn" id="revealBtn">公布汤底（房主胜）</button>
                </div>
            </div>

            <!-- 房主控制台（等待态） -->
            <div class="panel host-panel" id="hostPanel" style="display:none;">
                <div class="panel-header">
                    <span class="panel-title">HOST CONSOLE</span>
                    <span class="tag warn">房主</span>
                </div>
                <div class="host-actions">
                    <button class="btn btn-primary" id="startBtn">» 开始游戏（需≥2人）</button>
                    <button class="btn" id="closeBtn">解散房间</button>
                </div>
                <div class="kick-list" id="kickList"></div>
            </div>
        </main>

        <!-- 结局弹窗 -->
        <div class="game-over" id="overPanel" style="display:none;">
            <div class="game-over-content">
                <div class="result-icon" id="resultIcon">◍</div>
                <h2 class="glitch-text" id="resultTitle" data-text="GAME OVER">GAME OVER</h2>
                <p class="result-desc" id="resultDesc"></p>
                <p class="reveal-answer" id="answerText" style="display:none;"></p>
                <button class="btn btn-primary" id="backHallBtn">返回大厅</button>
                <button class="btn" id="resetBtn" style="display:none;">重置房间</button>
            </div>
        </div>
    </div>

    <script src="../../fun/mpostor.js"></script>
    <script src="script.js"></script>
</body>
</html>
